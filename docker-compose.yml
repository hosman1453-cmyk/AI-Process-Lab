services:
  n8n:
    image: n8nio/n8n:latest
    container_name: ai-process-n8n
    restart: always

    ports:
      - "5678:5678"

    volumes:
      - n8n_data:/home/node/.n8n

    environment:
      - TZ=Europe/Berlin

  postgres:
    image: postgres:16
    container_name: ai-process-postgres
    restart: always

    environment:
      POSTGRES_DB: ai_process_db
      POSTGRES_USER: n8n_user
      POSTGRES_PASSWORD: ***REMOVED***

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  n8n_data:
  postgres_data: