services:
  n8n:
    image: ${N8N_IMAGE}
    container_name: ai-process-n8n
    restart: always

    ports:
      - "${N8N_PORT}:5678"

    volumes:
      - n8n_data:/home/node/.n8n

    environment:
      - TZ=${TZ}

  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: ai-process-postgres
    restart: always

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  n8n_data:
  postgres_data:
